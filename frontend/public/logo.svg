<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181336" />
      <stop offset="50%" stop-color="#0f1123" />
      <stop offset="100%" stop-color="#090b14" />
    </linearGradient>

    <!-- Prism Violet to Cyan -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Warm Amber Glow for Hook/Payoff Spark -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.35" />
  
  <!-- Subtle Inner Film Rail Guides -->
  <rect x="14" y="14" width="72" height="72" rx="18" fill="none" stroke="white" stroke-width="0.75" stroke-opacity="0.08" stroke-dasharray="4 3" />

  <!-- Left Video Reel / Waveform Bar -->
  <rect x="22" y="32" width="6" height="36" rx="3" fill="#6366F1" fill-opacity="0.4" />
  <rect x="31" y="24" width="6" height="52" rx="3" fill="url(#prismGrad)" fill-opacity="0.8" />

  <!-- Center Clipper Prism / High-Retention Play Apex -->
  <path d="M42 22 L76 47 C79 49.5 79 53.5 76 56 L42 81 C39 83 35 81 35 77 L35 26 C35 22 39 20 42 22 Z" fill="url(#prismGrad)" filter="url(#glow)" />

  <!-- Inner Dynamic Cut Slice (The "Clip" Geometry) -->
  <path d="M44 26 L68 48 L44 48 Z" fill="#FFFFFF" fill-opacity="0.35" />
  <line x1="28" y1="50" x2="74" y2="50" stroke="#090B14" stroke-width="3" stroke-linecap="round" />

  <!-- The Spark (Hook Energy) -->
  <circle cx="73" cy="27" r="4.5" fill="url(#amberGrad)" filter="url(#glow)" />
  <circle cx="73" cy="27" r="2" fill="#FFFFFF" />
</svg>
